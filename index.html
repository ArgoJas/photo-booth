<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your Casino Knight Photo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Great+Vibes&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--red-dark:#6d0816;--gold:#f2b33d;--cream:#fff6e0;--bg:#0b0b0b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--cream)}
body{font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
header{margin-bottom:14px}
.script{font-family:'Great Vibes',cursive;font-size:34px;line-height:1}
.title{font-family:'Abril Fatface',Georgia,serif;font-size:44px;line-height:1;color:#fff;text-shadow:0 0 14px #ff9a3c;letter-spacing:.02em}
main{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px}
.photo{display:block;max-width:100%;max-height:60vh;border:3px solid var(--gold);border-radius:6px;box-shadow:0 10px 30px #000}
.btn{display:block;width:100%;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.04em;
  padding:16px 20px;border-radius:999px;border:3px solid var(--gold);background:var(--red);color:#fff;
  box-shadow:0 5px 0 var(--red-dark);cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-dark)}
.btn.alt{background:#1a1a1a;box-shadow:0 5px 0 #000}
.btn[hidden]{display:none}
.hint{font-size:16px;color:#e8e2d4;line-height:1.45}
.hint:empty{display:none}
.hint b{color:var(--gold)}
.hint a{color:var(--gold)}
.small{font-size:13px;color:#a9a39a;line-height:1.45}
.spinner{width:44px;height:44px;border:4px solid #333;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:28px auto 4px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="script">St. Veronica's</div><div class="title">CASINO KNIGHT</div></header>
<main id="app">
  <div class="spinner" id="spin"></div>
  <p class="hint" id="msg">Loading your photo…</p>
</main>
<script>
/* Casino Knight Photo Booth: guest photo page (hosted on GitHub Pages).
   The QR code on the booth opens this page as …/?id=<photo id>. The page gets the photo from your
   Apps Script web app and lets the guest save it with its own CasinoKnight2027-… name.

   Paste your Apps Script web app URL (the one that ends in /exec) between the quotes: */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw60Zp8pGlrj7CMnje77slBBBXenQ_NW4fbMsTQLNCWvFkue68XchBl5isbItvJ3uxlpQ/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id = new URLSearchParams(location.search).get('id') || '';
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let file = null, blobUrl = null, canShare = false;

function fail(html) { $('spin').hidden = true; $('msg').innerHTML = html; }

async function load(tries = 0) {
  if (!/^[a-z0-9]{12}$/.test(id)) return fail("Sorry, we couldn't find that photo. Try scanning the code at the booth again.");
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(SCRIPT_URL)) return fail('This page is not set up yet: SCRIPT_URL needs your Apps Script web app URL.');
  try {
    const r = await fetch(SCRIPT_URL + '?action=photo&id=' + id, { cache: 'no-store' });
    const j = await r.json();
    if (j.ok) return show(j);
    if (j.pending && tries < 40) {           // the booth may still be uploading (up to ~2 minutes)
      $('msg').textContent = 'Almost ready… your photo is on its way from the booth.';
      return setTimeout(() => load(tries + 1), 3000);
    }
    fail(j.pending ? 'Your photo is taking longer than usual. Try this page again in a few minutes.'
                   : "Sorry, we couldn't find that photo.");
  } catch (e) {
    if (tries < 5) return setTimeout(() => load(tries + 1), 3000);
    fail('We couldn’t load your photo. Check your connection and <a href="">try again</a>.');
  }
}

function b64ToBlob(b64, type) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type });
}

function show(j) {
  const blob = b64ToBlob(j.image, 'image/jpeg');
  file = new File([blob], j.name, { type: 'image/jpeg' });
  blobUrl = URL.createObjectURL(blob);
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
  const iosSave = isIOS && canShare;

  $('app').innerHTML =
    '<img class="photo" alt="Your Casino Knight photo">' +
    '<button class="btn" id="save">' + (iosSave ? '⬇ Save to Photos' : '⬇ Save to my phone') + '</button>' +
    '<p class="hint" id="hint">' + (iosSave ? 'Tap the button, then choose <b>Save Image</b>.' : '') + '</p>' +
    '<button class="btn alt" id="share"' + (canShare ? '' : ' hidden') + '>💬 Text or share it</button>' +
    '<p class="small">' + esc(j.thanks || '') + '</p>';
  document.querySelector('.photo').src = blobUrl;
  $('save').onclick = save;
  $('share').onclick = share;
}

function hint(html) { $('hint').innerHTML = html; }

async function save() {
  if (isIOS && canShare) {
    // On iPhone, a downloaded file goes to the Files app. The share sheet's "Save Image" puts it in Photos.
    try { await navigator.share({ files: [file] }); hint('Saved? It’s in your <b>Photos</b> app.'); }
    catch (e) { if (e.name !== 'AbortError') download(); }
    return;
  }
  download();
}

function download() {
  const a = document.createElement('a');
  a.href = blobUrl; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  hint(isIOS
    ? 'Saved to the <b>Files</b> app, in Downloads. To put it in Photos instead, press and hold the photo and choose <b>Save to Photos</b>.'
    : 'Saved as <b>' + esc(file.name) + '</b>. It’s in your <b>Gallery</b> or <b>Google Photos</b> under Downloads.');
}

async function share() {
  try { await navigator.share({ files: [file] }); } catch (e) {}
}

load();
</script>
</body>
</html>
